<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutu 学习素材中心</title>
<style>
  :root{--blue:#2f6fed;--green:#1fa86c;--orange:#f59e0b;--purple:#7c3aed;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f8fafc;}
  *{box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header{text-align:center;padding:10px 0 14px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--mut);font-size:13px;}
  h2{font-size:15px;margin:22px 0 10px;padding-left:8px;border-left:4px solid var(--blue);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);}
  .card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(47,111,237,.12);}
  .icon{font-size:26px;flex-shrink:0;}
  .info{flex:1;min-width:0;}
  .title{font-size:15px;font-weight:700;}
  .desc{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.5;}
  .tag{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;margin-right:6px;margin-top:4px;}
  .t-kao{background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .t-ext{background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
  .t-link{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;}
  .arrow{color:var(--mut);font-size:18px;flex-shrink:0;}
  footer{margin-top:24px;text-align:center;color:var(--mut);font-size:12px;padding-bottom:20px;}
  .note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;font-size:12px;color:#1e40af;line-height:1.6;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎓 Tutu 学习素材中心</h1>
    <div class="sub">国际课程辅导 · 交互演示与学术词汇统一入口</div>
  </header>

  <div class="note">💡 图例：<span class="tag t-kao">考点级</span>直连 IGCSE 考纲（考试要会）；<span class="tag t-ext">拓展级</span>加深理解（考试外、兴趣向）；<span class="tag t-link">地学连接</span>通往你的地球科学兴趣方向 🌍</div>

  <h2>📖 学术词汇本</h2>
  <a class="card" href="https://github.com/ybqworkspace/tutu-hub/blob/main/vocabulary/glossary.md">
    <span class="icon">📚</span>
    <span class="info">
      <span class="title">学科词汇本</span>
      <span class="desc">每次配图/演示自动积累，随时复习</span>
    </span>
    <span class="arrow">›</span>

  <div id="sections"></div>

  <footer>Tutu 国际教育导师 · 素材集中维护于 tutu-hub · 导航页随每次发布自动更新</footer>
</div>

<script>
(function(){
  var SUBJECTS=[
    {key:"compsci",icon:"💻",name:"计算机科学"},
    {key:"math",icon:"📐",name:"数学"},
    {key:"physics",icon:"⚡",name:"物理"},
    {key:"chemistry",icon:"🧪",name:"化学"},
    {key:"art",icon:"🖌️",name:"艺术与设计"}
  ];
  var raw=document.getElementById('nav-data').textContent.replace(/\/\*===NAV-DATA-START===\*\//,'')
      .replace(/\/\*===NAV-DATA-END===\*\//,'');
    var demos=JSON.parse(raw);
  var bySubj={};
  demos.forEach(function(d){ (bySubj[d.subject]=bySubj[d.subject]||[]).push(d); });
  var box=document.getElementById('sections');
  SUBJECTS.forEach(function(s){
    var h=document.createElement('h2');
    h.textContent=s.icon+' '+s.name;
    box.appendChild(h);
    var list=bySubj[s.key]||[];
    if(list.length===0){
      var ph=document.createElement('div');
      ph.className='card';
      ph.style.opacity='.65';
      ph.style.cursor='default';
      ph.innerHTML='<span class="icon">'+s.icon+'</span><span class="info"><span class="title">'+s.name+'素材</span><span class="desc">即将上线——交互演示持续制作中</span></span>';
      box.appendChild(ph);
    }else{
      list.forEach(function(d){
        var a=document.createElement('a');
        a.className='card';
        a.href='https://ybqworkspace.github.io/tutu-hub/'+d.file;
        var icon=document.createElement('span'); icon.className='icon'; icon.textContent=d.icon;
        var info=document.createElement('span'); info.className='info';
        var t=document.createElement('span'); t.className='title'; t.textContent=d.title;
        var ds=document.createElement('span'); ds.className='desc'; ds.textContent=d.desc;
        info.appendChild(t); info.appendChild(ds);
        if((d.tags||[]).length){
          var tg=document.createElement('span');
          d.tags.forEach(function(x){
            var sp=document.createElement('span');
            sp.className='tag '+(x.cls||'t-kao');
            sp.textContent=x.label;
            tg.appendChild(sp);
          });
          info.appendChild(tg);
        }
        var ar=document.createElement('span'); ar.className='arrow'; ar.textContent='›';
        a.appendChild(icon); a.appendChild(info); a.appendChild(ar);
        box.appendChild(a);
      });
    }
  });
})();
</script>
