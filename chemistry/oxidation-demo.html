<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>氧化反应 Oxidation</title>
<style>
  :root{--blue:#2f6fed;--green:#1fa86c;--orange:#f59e0b;--red:#ef4444;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;}
  *{box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  body{margin:0;background:#fff;color:var(--ink);}
  .wrap{max-width:780px;margin:0 auto;padding:14px;}
  h1{font-size:18px;margin:2px 0 2px;}
  .sub{color:var(--mut);font-size:12px;margin-bottom:10px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:640px){.cards{grid-template-columns:1fr;}}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px;}
  .card h2{font-size:13px;margin:0 0 8px;color:#374151;}
  .rxnbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .rxnbtn{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;line-height:1.35;text-align:left;}
  .rxnbtn.on{background:#eaf1ff;border-color:var(--blue);color:var(--blue);font-weight:700;}
  .formula{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;line-height:1.7;margin-bottom:6px;}
  .big{font-size:15px;font-weight:700;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  button{border:0;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
  .b1{background:var(--blue);color:#fff;}
  .b1:disabled{background:#c7d2f5;cursor:default;}
  .b3{background:#f1f5f9;color:#374151;}
  .stepbar{font-size:12px;color:var(--mut);margin-top:8px;}
  .dots{display:inline-flex;gap:5px;vertical-align:middle;margin-left:8px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:#dbe3ee;display:inline-block;}
  .dots i.on{background:var(--blue);}
  .status{font-size:13px;color:var(--ink);margin-top:8px;min-height:56px;line-height:1.6;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;}
  .tag{display:inline-block;margin-top:8px;font-size:11px;background:#fff7e6;color:#b45309;border:1px solid #fde68a;border-radius:20px;padding:3px 10px;}
  svg{display:block;width:100%;height:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fcfdff;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <h1 style="margin:0;">氧化反应演示 <span style="font-size:12px;color:var(--mut);font-weight:400">Oxidation Reaction</span></h1>
    <button id="langBtn" class="tag" style="cursor:pointer;border:1px solid var(--line);white-space:nowrap;flex-shrink:0;background:#fff;color:var(--ink);">EN 🇬🇧</button>
  </div>
  <div class="sub" data-en="Pick a reaction, press Next step by step: watch how oxygen bonds, electrons move and oxidation numbers change — see the three definitions of oxidation.">选一个反应 → 点「下一步」逐步看：氧怎么结合、电子怎么走、氧化数怎么变 → 看懂氧化的三重定义</div>
  <div class="cards">
    <div class="card"><h2 data-en="① Choose a reaction">① 选择反应 Reaction</h2>
      <div class="rxnbtns" id="rxnbtns"></div>
      <div class="formula" id="eq">方程式：—</div>
      <div class="formula" id="oxchg">氧化数变化：—</div>
    </div>
    <div class="card"><h2 data-en="② Step-by-step">② 分步演示 Steps</h2>
      <div class="btns">
        <button class="b3" id="prev" data-en="Previous">上一步</button>
        <button class="b1" id="next" data-en="Next">下一步</button>
        <button class="b3" id="reset" data-en="Restart">重新开始</button>
      </div>
      <div class="stepbar">步骤 <b id="stepno">1</b> / 4<span class="dots" id="dots"><i></i><i></i><i></i><i></i></span></div>
      <div class="status" id="st">先选一个反应，再点「下一步」。</div>
    </div>
  </div>
  <svg id="vis" viewBox="0 0 700 250" role="img" aria-label="氧化反应过程示意图"></svg>
  <div class="tag" id="tag" data-en="IGCSE: oxidation = gain of oxygen; reduction = loss of oxygen; they always happen together = redox.">考点：氧化 = 得到氧（gain of oxygen）；还原 = 失去氧；两者同时发生，叫氧化还原反应（redox）。</div>
</div>
<script>
(function(){
  var lang = 'en';  // 默认英文（国际课程），可切中文
  var zhText = {};
  var zhCounter = 0;
  function collectZh(){
    document.querySelectorAll('[data-en]').forEach(function(node){
      if (!node.dataset.zhk){ node.dataset.zhk = 'n'+(zhCounter++); zhText[node.dataset.zhk] = node.innerHTML; }
    });
  }
  function setLang(l){
    lang = l;
    collectZh();
    document.querySelectorAll('[data-en]').forEach(function(node){
      node.innerHTML = (l === 'en') ? node.getAttribute('data-en') : zhText[node.dataset.zhk];
    });
    var sb = document.querySelector('.stepbar');
    sb.innerHTML = (l==='en' ? 'Step <b id="stepno">1</b> / 4<span class="dots" id="dots"><i></i><i></i><i></i><i></i></span>'
                          : '步骤 <b id="stepno">1</b> / 4<span class="dots" id="dots"><i></i><i></i><i></i><i></i></span>');
    el.stepno = document.getElementById('stepno');
    el.dots = document.getElementById('dots');
    if (window.quizSetLang) window.quizSetLang(l); // 小测跟随主语言切换
    document.getElementById('langBtn').textContent = (l === 'zh') ? 'EN 🇬🇧' : '中文';
    buildBtns();
    render();
  }
  function t(zh, en){ return (lang === 'en') ? en : zh; }

  var RXNS = [
    {name:'镁燃烧（金属）', nameEn:'Magnesium burns (metal)', eq:'2Mg + O₂ → 2MgO', el:'Mg', color:'#9ca3af',
     oxc:'Mg：0 → +2（每个 Mg 失去 2e⁻）', oxcEn:'Mg: 0 → +2 (each Mg loses 2e⁻)',
     type:'ionic', prod:'MgO（氧化镁，白色固体）', prodEn:'MgO (magnesium oxide, white solid)'},
    {name:'铜加热（金属）', nameEn:'Copper heated (metal)', eq:'2Cu + O₂ → 2CuO', el:'Cu', color:'#d97706',
     oxc:'Cu：0 → +2（每个 Cu 失去 2e⁻）', oxcEn:'Cu: 0 → +2 (each Cu loses 2e⁻)',
     type:'ionic', prod:'CuO（氧化铜，黑色固体）', prodEn:'CuO (copper(II) oxide, black solid)'},
    {name:'碳燃烧（非金属）', nameEn:'Carbon burns (non-metal)', eq:'C + O₂ → CO₂', el:'C', color:'#4b5563',
     oxc:'C：0 → +4（与氧结合，共用电子对偏向 O）', oxcEn:'C: 0 → +4 (bonds with oxygen; shared electrons shift toward O)',
     type:'covalent', prod:'CO₂（二氧化碳，气体）', prodEn:'CO₂ (carbon dioxide, gas)'}
  ];
  var rxn = 0, step = 0;
  var el = {eq:document.getElementById('eq'), oxc:document.getElementById('oxchg'),
    st:document.getElementById('st'), vis:document.getElementById('vis'),
    stepno:document.getElementById('stepno'), dots:document.getElementById('dots'),
    prev:document.getElementById('prev'), next:document.getElementById('next'),
    rxnbtns:document.getElementById('rxnbtns')};

  function atom(x,y,r,fill,label,sub){
    var s = '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="#ffffff" stroke-width="2"/>';
    s += '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+label+'</text>';
    if(sub){ s += '<text x="'+x+'" y="'+(y-r-6)+'" text-anchor="middle" font-size="12" fill="#374151">'+sub+'</text>'; }
    return s;
  }
  function o2(x,y,sub){
    var s = '<circle cx="'+(x-13)+'" cy="'+y+'" r="15" fill="#ef4444" stroke="#fff" stroke-width="2"/>';
    s += '<circle cx="'+(x+13)+'" cy="'+y+'" r="15" fill="#ef4444" stroke="#fff" stroke-width="2"/>';
    s += '<text x="'+(x-13)+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">O</text>';
    s += '<text x="'+(x+13)+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">O</text>';
    if(sub){ s += '<text x="'+x+'" y="'+(y-24)+'" text-anchor="middle" font-size="12" fill="#374151">'+sub+'</text>'; }
    return s;
  }
  function flame(x,y){
    return '<path d="M'+x+','+y+' q-14,-20 0,-42 q6,10 12,4 q6,20 -12,38 z" fill="#f59e0b" opacity="0.9"/>' +
      '<text x="'+x+'" y="'+(y+18)+'" text-anchor="middle" font-size="12" fill="#b45309">' + t('加热 / 点燃','heat / ignite') + '</text>';
  }
  function electron(x1,y1,x2,y2,delay){
    return '<circle r="6" fill="#2f6fed"><animate attributeName="cx" values="'+x1+';'+x2+'" dur="1.6s" begin="'+delay+'s" repeatCount="indefinite"/>' +
      '<animate attributeName="cy" values="'+y1+';'+y2+'" dur="1.6s" begin="'+delay+'s" repeatCount="indefinite"/>' +
      '<animate attributeName="opacity" values="1;1;0" dur="1.6s" begin="'+delay+'s" repeatCount="indefinite"/></circle>' +
      '<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-8)+'" text-anchor="middle" font-size="11" fill="#2f6fed">e⁻</text>';
  }
  function numline(from,to,color,label){
    var x0=120,x1=580,cy=200,min=-1,max=5;
    function px(v){ return x0 + (v-min)/(max-min)*(x1-x0); }
    var s = '<line x1="'+x0+'" y1="'+cy+'" x2="'+x1+'" y2="'+cy+'" stroke="#cbd5e1" stroke-width="2"/>';
    for(var v=0;v<=4;v++){
      s += '<line x1="'+px(v)+'" y1="'+(cy-5)+'" x2="'+px(v)+'" y2="'+(cy+5)+'" stroke="#94a3b8"/>';
      s += '<text x="'+px(v)+'" y="'+(cy+22)+'" text-anchor="middle" font-size="12" fill="#6b7280">'+(v===0?'0':'+'+v)+'</text>';
    }
    s += '<circle cx="'+px(from)+'" cy="'+cy+'" r="8" fill="#1fa86c"/><text x="'+px(from)+'" y="'+(cy-14)+'" text-anchor="middle" font-size="12" fill="#1fa86c">起点 0</text>';
    s += '<line x1="'+px(from)+'" y1="'+(cy-32)+'" x2="'+px(to)+'" y2="'+(cy-32)+'" stroke="'+color+'" stroke-width="3" marker-end="url(#arw)"/>';
    s += '<text x="'+((px(from)+px(to))/2)+'" y="'+(cy-42)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+color+'">'+label+'</text>';
    s += '<circle cx="'+px(to)+'" cy="'+cy+'" r="8" fill="'+color+'"/><text x="'+px(to)+'" y="'+(cy-14)+'" text-anchor="middle" font-size="12" fill="'+color+'">终点 +'+to+'</text>';
    return s;
  }

  function scene0(r){
    var s = atom(220,120,26,r.color,r.el,t('氧化数 0','ox. no. 0')) + o2(460,120,t('氧化数 0','ox. no. 0'));
    s += '<text x="220" y="40" text-anchor="middle" font-size="13" fill="#6b7280">' + t('反应前：单质各自独立，还没结合','Before: the elements are separate, not yet bonded') + '</text>';
    return s;
  }
  function scene1(r){
    var s = scene0(r) + flame(340,190);
    return s;
  }
  function scene2(r){
    if(r.type==='ionic'){
      var s = atom(150,110,26,r.color,r.el,'') + o2(300,110,'');
      s += electron(185,100,270,100,0) + electron(185,125,270,125,0.5);
      s += '<text x="225" y="60" text-anchor="middle" font-size="12" fill="#2f6fed">' + t('电子 e⁻ 从金属转移给氧','electrons e⁻ move from metal to oxygen') + '</text>';
      s += atom(480,110,26,r.color,r.el,t('失去 2e⁻ → 2+','loses 2e⁻ → 2+'));
      s += '<circle cx="560" cy="110" r="18" fill="#ef4444" stroke="#fff" stroke-width="2"/><text x="560" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">O</text>';
      s += '<text x="560" y="76" text-anchor="middle" font-size="12" fill="#374151">' + t('得到 2e⁻ → 2−','gains 2e⁻ → 2−') + '</text>';
      s += '<text x="350" y="190" text-anchor="middle" font-size="13" fill="#374151">' + t(r.el+' 失去电子（氧化），O 得到电子（还原）——两个过程同时发生',r.el+' loses electrons (oxidised), O gains them (reduced) — both happen together') + '</text>';
      return s;
    } else {
      var s = '<circle cx="350" cy="110" r="26" fill="'+r.color+'" stroke="#fff" stroke-width="2"/>';
      s += '<text x="350" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C</text>';
      s += '<circle cx="295" cy="110" r="18" fill="#ef4444" stroke="#fff" stroke-width="2"/><text x="295" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">O</text>';
      s += '<circle cx="405" cy="110" r="18" fill="#ef4444" stroke="#fff" stroke-width="2"/><text x="405" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">O</text>';
      s += '<line x1="316" y1="104" x2="324" y2="104" stroke="#2f6fed" stroke-width="3"/><line x1="316" y1="116" x2="324" y2="116" stroke="#2f6fed" stroke-width="3"/>';
      s += '<line x1="376" y1="104" x2="384" y2="104" stroke="#2f6fed" stroke-width="3"/><line x1="376" y1="116" x2="384" y2="116" stroke="#2f6fed" stroke-width="3"/>';
      s += '<text x="350" y="70" text-anchor="middle" font-size="12" fill="#2f6fed">' + t('共用电子对（covalent bond），但偏向 O','shared electron pair (covalent bond) shifted toward O') + '</text>';
      s += '<text x="350" y="190" text-anchor="middle" font-size="13" fill="#374151">' + t('C 没有完全失去电子，但它结合了氧、氧化数升高 → 仍然被氧化','C does not fully lose electrons, but it gains oxygen and its oxidation number rises → still oxidised') + '</text>';
      return s;
    }
  }
  function scene3(r){
    var to = (r.type==='ionic') ? 2 : 4;
    var s = '<text x="350" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">' + t('产物：','Product: ') + r.prod + '</text>';
    s += numline(0,to,'#ef4444', t('氧化数升高 = 被氧化','oxidation number rises = oxidised'));
    return s;
  }
  var SCENES = [scene0, scene1, scene2, scene3];
  var STATUS = {
    0:function(r){ return t('第 1 步｜反应前：'+r.el+' 单质和氧气 O₂ 各自独立。此时两者的氧化数（oxidation number）都是 0。','Step 1 | Before: '+r.el+' and oxygen O₂ are separate elements. Both have oxidation number 0.'); },
    1:function(r){ return t('第 2 步｜启动：多数氧化反应需要加热或点燃提供启动能量（activation energy）。一旦开始，反应常自己放热维持下去（如燃烧）。','Step 2 | Start: most oxidation needs heat or a flame for activation energy. Once started, it often keeps itself going by releasing heat (e.g. burning).'); },
    2:function(r){
      if(r.type==='ionic'){ return t('第 3 步｜电子转移：每个 '+r.el+' 原子失去 2 个电子变成 '+r.el+'²⁺——失去电子就是被氧化（oxidation）。氧得到电子被还原。口诀 OIL RIG：Oxidation Is Loss, Reduction Is Gain。','Step 3 | Electron transfer: each '+r.el+' atom loses 2 electrons to become '+r.el+'²⁺ — losing electrons IS oxidation. Oxygen gains electrons (reduction). Mnemonic OIL RIG: Oxidation Is Loss, Reduction Is Gain.'); }
      return t('第 3 步｜结合成 CO₂：碳与氧形成共价键，没有电子的完全得失，但共用电子对偏向氧，碳的氧化数升到 +4——结合氧、氧化数升高，就是氧化。','Step 3 | Forms CO₂: carbon bonds covalently with oxygen — no full electron transfer, but the shared pair shifts toward O and carbon\'s oxidation number rises to +4 — gaining oxygen / higher oxidation number = oxidation.');
    },
    3:function(r){ return t('第 4 步｜总结：'+r.el+' 的氧化数升高，被氧化，生成氧化物。氧化 = ① 得到氧 gain of oxygen ② 失去电子 loss of electrons ③ 氧化数升高。三种说法描述同一件事。'+r.el+' 被氧化的同时让 O₂ 被还原，所以 '+r.el+' 是还原剂（reducing agent）。','Step 4 | Summary: '+r.el+' oxidation number rises — it is oxidised, forming an oxide. Oxidation = ① gain of oxygen ② loss of electrons ③ rise in oxidation number. All three describe the same event. '+r.el+' oxidises while O₂ is reduced, so '+r.el+' is the reducing agent.'); }
  };

  function render(msg){
    var r = RXNS[rxn];
    el.eq.textContent = t('方程式：','Equation: ') + r.eq;
    el.oxc.textContent = t('氧化数变化：','Oxidation no. change: ') + (lang==='en' ? r.oxcEn : r.oxc);
    el.stepno.textContent = step + 1;
    var ds = el.dots.children;
    for(var i=0;i<4;i++){ ds[i].className = (i<=step)?'on':''; }
    var svg = '<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs>';
    svg += SCENES[step](r);
    el.vis.innerHTML = svg;
    el.prev.disabled = (step===0);
    el.next.disabled = (step===3);
    el.st.textContent = msg || STATUS[step](r);
  }
  function buildBtns(){
    el.rxnbtns.innerHTML = '';
    RXNS.forEach(function(r,i){
      var b = document.createElement('button');
      b.className = 'rxnbtn' + (i===rxn?' on':'');
      b.innerHTML = (lang==='en'?r.nameEn:r.name) + '<br><span style="font-size:11px;color:#6b7280">' + r.eq + '</span>';
      b.addEventListener('click', function(){ rxn=i; step=0; render(); });
      el.rxnbtns.appendChild(b);
    });
  }
  el.next.addEventListener('click', function(){ if(step<3){ step++; render(); } });
  el.prev.addEventListener('click', function(){ if(step>0){ step--; render(); } });
  document.getElementById('reset').addEventListener('click', function(){ step=0; render(t('已重置：再点「下一步」逐步观察。','Reset: press Next to watch step by step.')); });
  document.getElementById('langBtn').addEventListener('click', function(){ setLang(lang === 'zh' ? 'en' : 'zh'); });
  buildBtns();
  setLang('en'); // 应用英文到全部静态标签并刷新（默认英文界面；内部会重跑 buildBtns+render）
  render(t('选一个反应（建议从镁燃烧开始），然后点「下一步」。','Pick a reaction (start with magnesium burning), then press Next.'));
})();
</script>


<div class="qzwrap" style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:#fff;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <h2 style="font-size:15px;margin:0 0 6px;">🎯 考点小测 <span style="font-size:11px;color:var(--mut);font-weight:400">Quiz · IGCSE/A-Level</span></h2>
    <span id="qzScore" style="font-size:12px;color:var(--mut);font-weight:700;">—</span>
  </div>
  <div id="qzBody" style="font-size:13px;line-height:1.6;"></div>
</div>
<script>
(function(){
  var QUIZ = [{"ans": 3, "zh": {"q": "下列哪一项 NOT 属于「氧化」（oxidation）的定义？", "opts": ["得到氧（gain of oxygen）", "失去电子（loss of electrons）", "氧化数升高（rise in oxidation number）", "失去氧（loss of oxygen）"], "exp": "氧化 = 得氧 / 失电子 / 氧化数升高；失去氧是「还原」（reduction）。两者永远同时发生 = 氧化还原 redox。", "note": "氧化三重定义"}, "en": {"q": "Which of the following is NOT a definition of oxidation?", "opts": ["Gain of oxygen", "Loss of electrons", "Rise in oxidation number", "Loss of oxygen"], "exp": "Oxidation = gain of oxygen / loss of electrons / rise in oxidation number. Loss of oxygen is REDUCTION. They always happen together = redox.", "note": "Three definitions"}}, {"ans": 1, "zh": {"q": "反应 2Mg + O₂ → 2MgO 中，镁（Mg）的角色是？", "opts": ["氧化剂（oxidising agent）", "还原剂（reducing agent）", "催化剂（catalyst）", "电解质（electrolyte）"], "exp": "Mg 失去电子被氧化，它使 O₂ 被还原 → Mg 是还原剂。记住：被氧化的是还原剂（reducing agent is oxidised）。", "note": "氧化剂/还原剂"}, "en": {"q": "In 2Mg + O₂ → 2MgO, what is the role of magnesium (Mg)?", "opts": ["Oxidising agent", "Reducing agent", "Catalyst", "Electrolyte"], "exp": "Mg loses electrons and is oxidised; it causes O₂ to be reduced → Mg is the reducing agent. Remember: the reducing agent is itself oxidised.", "note": "Oxidising/reducing agent"}}, {"ans": 1, "zh": {"q": "碳燃烧生成 CO₂ 时，碳的氧化数（oxidation number）从 0 变成？", "opts": ["+2", "+4", "−4", "0（不变）"], "exp": "C 与 O 共用电子对但偏向氧，C 的氧化数升到 +4。非金属也能被氧化——氧化数升高即可，不一定要完全失去电子。", "note": "氧化数计算"}, "en": {"q": "When carbon burns to form CO₂, carbon's oxidation number changes from 0 to what?", "opts": ["+2", "+4", "−4", "0 (unchanged)"], "exp": "C shares electron pairs with O but they shift toward O, so C's oxidation number rises to +4. Non-metals can also be oxidised — a rise in oxidation number is enough; full electron loss is not required.", "note": "Oxidation number"}}];
  var qzlang = 'en';          // 默认英文（与主界面一致）
  var qi = 0, correct = 0, answered = false;
  var body = document.getElementById('qzBody');
  var score = document.getElementById('qzScore');
  function cur(it){ return qzlang === 'en' ? it.en : it.zh; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function pick(zh, en){ return qzlang === 'en' ? en : zh; }
  function show(){
    if (qi >= QUIZ.length){ end(); return; }
    var it = QUIZ[qi], c = cur(it);
    answered = false;
    score.textContent = correct + ' / ' + QUIZ.length;
    var h = '<div style="margin-bottom:6px;"><b>' + esc(c.q) + '</b></div>';
    if (c.note){ h += '<div style="font-size:11px;color:var(--mut);margin-bottom:6px;">' + pick('考点：','Topic: ') + esc(c.note) + '</div>'; }
    c.opts.forEach(function(o, i){
      h += '<button data-i="'+i+'" style="display:block;width:100%;text-align:left;margin:4px 0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;font-size:13px;cursor:pointer;font-family:inherit;">' + esc(o) + '</button>';
    });
    h += '<div id="qzExp" style="margin-top:8px;min-height:20px;"></div>';
    h += '<div style="margin-top:8px;"><button id="qzNext" style="border:0;border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;font-family:inherit;">' + (qi === QUIZ.length-1 ? pick('查看结果','See result') : pick('下一题','Next')) + '</button></div>';
    body.innerHTML = h;
    body.querySelectorAll('button[data-i]').forEach(function(b){
      b.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        var idx = parseInt(b.dataset.i, 10);
        var ok = (idx === it.ans);
        if (ok) correct++;
        body.querySelectorAll('button[data-i]').forEach(function(x, j){
          var jj = parseInt(x.dataset.i, 10);
          if (jj === it.ans){ x.style.borderColor = 'var(--green)'; x.style.background = '#dcfce7'; }
          else if (jj === idx){ x.style.borderColor = 'var(--red)'; x.style.background = '#fee2e2'; }
          x.disabled = true;
        });
        var exp = document.getElementById('qzExp');
        exp.innerHTML = (ok ? (qzlang==='en'?'✅ Correct!':'✅ 答对！') : (qzlang==='en'?'❌ Wrong. Correct answer: ':'❌ 答错。正确答案：') + esc(c.opts[it.ans]) + (qzlang==='en'?'.': '。')) + '<br>' + esc(c.exp);
        score.textContent = correct + ' / ' + QUIZ.length;
      });
    });
    document.getElementById('qzNext').addEventListener('click', function(){ qi++; show(); });
  }
  function end(){
    score.textContent = correct + ' / ' + QUIZ.length;
    var pct = Math.round(correct / QUIZ.length * 100);
    var msg = pct === 100 ? pick('🎉 全对！概念很扎实。','🎉 Perfect! Solid understanding.') : pct >= 67 ? pick('👍 不错！再看一眼错题解析。','👍 Good! Review the explanations of any wrong ones.') : pick('💪 建议回到上面演示重玩一遍，再回来测。','💪 Replay the demo above, then try again.');
    body.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px;">' + pick('测试完成：','Quiz done: ') + correct + ' / ' + QUIZ.length + ' (' + pct + '%)</div><div>' + msg + '</div><div style="margin-top:10px;"><button id="qzRestart" style="border:0;border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer;background:var(--green);color:#fff;font-family:inherit;">' + pick('再测一次','Retry') + '</button></div>';
    document.getElementById('qzRestart').addEventListener('click', function(){ qi = 0; correct = 0; show(); });
  }
  function setQzLang(l){ qzlang = l; if (qi < QUIZ.length){ show(); } }
  window.quizSetLang = setQzLang;   // 供主 setLang 联动
  show();
})();
</script>

</body>
</html>
